name: gate

# 构建 + 场景回归 + PR 分类。数据库不入库：现场从社区公开镜像构建并按镜像
# commit 缓存（见 db-refresh.yml 同一缓存键）。
# ⚠️ runner 钉住 ubuntu-24.04（不追 latest）：构建可复现性依赖钉住的系统依赖世界，
# latest 被 GitHub 滚动升级时会无预警破坏构建。升级 runner = 显式改动 + 跑全量门。
# 政策（2026-11-20）：不承诺多发行版；Windows 走 MinGW（M2 已验收，nightly 抽样门 = windows-nightly
# job，全量对拍走 wuying 云电脑）；macOS 由维护者本机全量门覆盖。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'   # 每日 05:00 +08:00 全量回归（nightly）
  workflow_dispatch:

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db:
    runs-on: ubuntu-24.04
    outputs:
      mirror_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          # 带 runner token：未认证 60 次/h/IP 在共享 Azure 出口池经常被打空（2026-11-21
          # dispatch 实证，curl -sf 静默吞 403 → python 吃空输入报 JSONDecodeError）；
          # GITHUB_TOKEN 对公开仓的 REST 配额是按安装 1000+/h。
          SHA=$(curl -sfL -H "Authorization: Bearer ${{ github.token }}" \
                https://api.github.com/repos/SeerAPI/seer-unity-assets/commits/HEAD \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "镜像 HEAD：$SHA"
      - uses: actions/cache@v4
        id: cache
        with:
          path: scripts/data/processed
          # v2：battle_items 官方快照通道上线（2026-11-21）。快照不随镜像 sha 变化，
          # 同 key 会命中无药剂表的旧缓存 → 升版本号强制重建一次。
          key: seer-db-v2-${{ steps.meta.outputs.sha }}
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          # battle_items 官方快照（手工重建，红线不入库）走 Actions secret 私有通道：
          # 本地/wuying 的 DB 药剂表 91 行，CI 降级空表曾致 4 场景环境差红（docs §9.2）。
          # fork PR 无 secret → 自动回落降级路径（已知行为）。
          BATTLEITEM_SNAPSHOT_B64: ${{ secrets.BATTLEITEM_SNAPSHOT_B64 }}
        run: |
          pip install seerapi-solaris
          if [ -n "$BATTLEITEM_SNAPSHOT_B64" ]; then
            mkdir -p scripts/data/raw/official
            printf '%s' "$BATTLEITEM_SNAPSHOT_B64" | base64 -d \
              > scripts/data/raw/official/Battleitem_reconstructed_pre_k450.json
            echo "battle_items 快照已落位（$(wc -c < scripts/data/raw/official/Battleitem_reconstructed_pre_k450.json) 字节）"
          else
            echo "[WARN] 无 BATTLEITEM_SNAPSHOT_B64（fork PR？）——battle_items 降级为空表"
          fi
          python3 scripts/fetch_seer_unity_bytes.py
          python3 scripts/decode_seer_bytes.py
          python3 scripts/import_seer_unity_sqlite.py
          tools/db_patches/apply_all.sh
          ls -lh scripts/data/processed/seer_unity.sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: seer-db
          path: scripts/data/processed/seer_unity.sqlite

  build-test:
    needs: db
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # PR 场景提取需要 diff
      - uses: actions/download-artifact@v4
        with: { name: seer-db, path: scripts/data/processed }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: |
          sudo apt-get update && sudo apt-get install -y ccache
          ccache --max-size=500M
      - name: configure & build
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)
      - name: registry dump
        run: ./build/sim_server --dump-registry-exit build/registry.json
      - name: smoke
        run: ./build/sim_smoke_test
      - name: affected scenarios（PR）
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          IDS=$(git diff --name-only "$BASE"...HEAD -- test/scenario/ \
                | grep -oE 'scenario_[0-9]+' | grep -oE '[0-9]+' | sort -un || true)
          FAILED=0
          for b in build/sim_scenario_*; do
            id=$(basename "$b" | grep -oE '[0-9]+' | head -1)
            # PR 只跑变更场景 + 号段相邻场景（同族联动）；nightly 跑全量
            if [ -n "$IDS" ] && ! echo "$IDS" | grep -qw "$id"; then continue; fi
            timeout 300 "$b" || { echo "FAIL $b"; FAILED=1; }
          done
          exit $FAILED
      - name: all scenarios（nightly / push main）
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          FAILED=0
          for b in build/sim_scenario_*; do
            timeout 300 "$b" || { echo "FAIL $b"; FAILED=1; }
          done
          exit $FAILED
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: registry-json, path: build/registry.json }

  # Windows 门（移植决策 D1/D2 口径：MSYS2 UCRT64 MinGW + PowerShell/pwsh）。
  # 只在 nightly 与手动触发跑，与 ubuntu build-test 并行（同 needs: db，public runner 免费）。
  # 范围 = sim_server + smoke + 三插件部署 + 抽样场景（排序后每 10 取 1 ≈ 100 个）——
  # 全量 982 场景对拍走 wuying 云电脑（docs_local/docs/07-工具与测试/Windows-移植.md §6），不烧 runner。
  windows-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: db
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: seer-db, path: scripts/data/processed }
      - name: toolchain（MSYS2 UCRT64 MinGW-w64）
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false         # 用镜像预装 C:\msys64（release:true 会现场下载全新 MSYS2，根落 runner temp 不可钉——2026-11-21 三跑实证）
          update: true           # 预装副本的 sync db 偏旧：不刷库 pacman -S 找不到目标包
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sqlite3
      - name: configure & build（引擎 + 插件部署 + 抽样场景）
        run: |
          # ⚠️ runner 实证（2026-11-21 四跑）：① 镜像自带 C:\mingw64 会抢编译器选择；
          # ② setup-msys2 默认 release:true 的全新 MSYS2 根在 runner temp，不可钉 →
          #    已改 release:false 用镜像 C:\msys64；③ GITHUB_PATH 前置实测不生效。
          # → 动态定位 ucrt64 根兜底（gcc on PATH → C:\msys64 → hostedtoolcache 扫描），
          #   存 GITHUB_ENV；工具链与 SQLite3 全显式绝对路径；运行 DLL 每步内联前置。
          function Find-Ucrt64 {
            $cands = @('C:\msys64\ucrt64')
            $g = (Get-Command gcc.exe -ErrorAction SilentlyContinue).Source
            if ($g) { $cands += (Split-Path -Parent (Split-Path -Parent $g)) }
            $cands += (Get-ChildItem 'C:\hostedtoolcache\windows\msys2-installer\*\x64\msys64\ucrt64' -Directory -ErrorAction SilentlyContinue).FullName
            foreach ($c in $cands) {
              if ($c -and (Test-Path (Join-Path $c 'bin\gcc.exe')) -and (Test-Path (Join-Path $c 'include\sqlite3.h'))) {
                return ($c -replace '\\', '/')
              }
            }
            throw '定位不到含 sqlite3 的 ucrt64 工具链（setup-msys2 安装异常？）'
          }
          $u = Find-Ucrt64
          "UCRT_ROOT=$u" | Out-File -Append $env:GITHUB_ENV
          "UCRT_ROOT=$u"
          $env:PATH = "$u/bin;C:\msys64\usr\bin;$env:PATH"
          Add-MpPreference -ExclusionPath (Get-Location) -ErrorAction SilentlyContinue   # D8：显式排除实时扫描（100+ 小链接显著拖慢）
          $sqliteLib = @("$u/lib/libsqlite3.dll.a", "$u/lib/libsqlite3.a") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sqliteLib) { throw "ucrt64 下找不到 libsqlite3（.dll.a/.a）" }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_MAKE_PROGRAM=$u/bin/ninja.exe" `
            "-DCMAKE_C_COMPILER=$u/bin/gcc.exe" "-DCMAKE_CXX_COMPILER=$u/bin/g++.exe" `
            "-DCMAKE_PREFIX_PATH=$u" `
            "-DSQLite3_INCLUDE_DIR=$u/include" "-DSQLite3_LIBRARY=$sqliteLib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 确定性抽样：场景源按名排序后每 10 取 1（目标命名同 gate.ps1 全量门：sim_<basename>）
          $targets = @('sim_server','sim_smoke_test',
                       'moves_plugin_deploy','soul_plugin_deploy','suit_plugin_deploy')
          $srcs = @(Get-ChildItem test/scenario -Filter 'scenario_*.cpp' | Sort-Object Name)
          for ($i = 0; $i -lt $srcs.Count; $i += 10) { $targets += "sim_$($srcs[$i].BaseName)" }
          "Windows nightly：抽样 $($targets.Count - 5)/$($srcs.Count) 场景" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          cmake --build build -j $env:NUMBER_OF_PROCESSORS --target @targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: registry dump
        run: |
          $env:PATH = "$env:UCRT_ROOT/bin;$env:PATH"   # 运行期 MinGW/sqlite DLL（sbs_rand.dll 在 exe 旁）
          ./build/sim_server.exe --dump-registry-exit build/registry.json
      - name: smoke
        run: |
          $env:PATH = "$env:UCRT_ROOT/bin;$env:PATH"
          ./build/sim_smoke_test.exe
      - name: sampled scenarios（单例 120s 超时，口径同 gate.ps1）
        run: |
          $env:PATH = "$env:UCRT_ROOT/bin;$env:PATH"
          # 已知平台/环境红兜底（2026-11-21 三平台对拍，清单与定性见
          # docs_local/docs/07-工具与测试/Windows-移植.md §9）。
          # 集合外的红 = 新平台差异，哨兵触发 job 红；集合应随逐个归因收缩，只减不增。
          $knownRed = @(
            'sim_scenario_2460_lowdmg_gate3.exe',         # wuying 全量门 6 红（§8 历史签名族）
            'sim_scenario_2520_window_roll_anomaly.exe',
            'sim_scenario_2550_untouched_gate.exe',
            'sim_scenario_2570_window_drain.exe',
            'sim_scenario_7931_selection_timing.exe',
            'sim_scenario_8510_k464.exe'
          )
          $fails = @()
          $bins = @(Get-ChildItem build -Filter 'sim_scenario_*.exe' | Sort-Object Name)
          New-Item -ItemType Directory -Force build/golden | Out-Null
          foreach ($exe in $bins) {
            # 场景二进制必须以仓库根为 CWD（DB/插件按相对路径加载，同 gate.ps1）；
            # D16 链随跑落盘 → 跑完与入库基线比对（预期漂移清单同 gate.ps1，§9.5）
            $env:SBS_SCENARIO_TRACE = "build/golden/$($exe.BaseName -replace '^sim_','').chain"
            $p = Start-Process -FilePath $exe.FullName -WorkingDirectory (Get-Location) -NoNewWindow -PassThru
            if (-not $p.WaitForExit(120000)) {
              try { $p.Kill() } catch {}
              Write-Host "TIMEOUT $($exe.Name)"; $fails += $exe.Name; continue
            }
            if ($p.ExitCode -ne 0) { Write-Host "FAIL($($p.ExitCode)) $($exe.Name)"; $fails += $exe.Name }
          }
          Remove-Item Env:SBS_SCENARIO_TRACE -ErrorAction SilentlyContinue
          # D16 链比对（子集模式：只比产出面；预期漂移清单与 wuying gate.ps1 同一份）
          $gFail = @(); $gMatch = 0; $gKnown = 0
          $expected = @(Get-Content tools/windows/golden_expected_diff.txt -Encoding UTF8 -ErrorAction SilentlyContinue |
            Where-Object { $_ -and -not $_.StartsWith('#') })
          foreach ($chain in @(Get-ChildItem build/golden -Filter '*.chain')) {
            $ref = "test/scenario/golden/$($chain.Name)"
            if (-not (Test-Path $ref)) { $gFail += "NO_BASELINE $($chain.Name)"; Write-Host "NO_BASELINE $($chain.Name)"; continue }
            if ((Get-FileHash $chain.FullName -Algorithm SHA256).Hash -eq (Get-FileHash $ref -Algorithm SHA256).Hash) {
              $gMatch++
            } elseif ($expected -contains $chain.BaseName) { $gKnown++ }
            else { $gFail += "GOLDEN_DIFF $($chain.Name)"; Write-Host "GOLDEN_DIFF $($chain.Name)" }
          }
          $new = @($fails | Where-Object { $knownRed -notcontains $_ })
          "Windows 抽样回归：$($bins.Count - $fails.Count)/$($bins.Count) 绿；已知红 $($fails.Count - $new.Count)；新红 $($new.Count)（$(if ($new.Count) { $new -join ', ' })）" |
            Out-File -Append $env:GITHUB_STEP_SUMMARY
          "golden 链：MATCH $gMatch / 预期内漂移 $gKnown / 异常 $($gFail.Count)（$(if ($gFail.Count) { $gFail -join ', ' })）" |
            Out-File -Append $env:GITHUB_STEP_SUMMARY
          exit ([int][bool]($new.Count + $gFail.Count))
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: registry-json-windows, path: build/registry.json }

  classify:
    if: github.event_name == 'pull_request'
    needs: build-test
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.out.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: label-check
        run: |
          if gh pr view ${{ github.event.pull_request.number }} --json labels \
               -q '.labels[].name' 2>/dev/null | grep -qx 'kernel-approved'; then
            echo "KERNEL_APPROVED=1" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - id: out
        run: tools/ci/classify.sh \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
        # classify.sh 退出码：1=需人工（mixed/kernel），2=引注缺失
        continue-on-error: true

  verdict:
    if: github.event_name == 'pull_request'
    needs: [build-test, classify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: apply tier policy
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ needs.classify.outputs.tier }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case "$TIER" in
            effects-new)
              gh pr edit "$PR" --add-label tier0-auto
              gh pr merge "$PR" --auto --squash
              echo "tier0：CI 全绿 + 引注齐，已挂自动合并"
              ;;
            effects-ruling)
              gh pr edit "$PR" --add-label needs-ruling
              gh pr comment "$PR" --body "修改了既有效果/场景期望值（口径变更），等待维护者终审。"
              ;;
            kernel)
              gh pr comment "$PR" --body "内核改动需要先开 issue 讨论并取得 kernel-approved 标签。当前 PR 会被阻止合并。"
              exit 1
              ;;
            mixed)
              gh pr comment "$PR" --body "效果层与内核层混碰：请拆成两个 PR（机器拒因见 gate 摘要）。"
              exit 1
              ;;
            *) echo "tier=$TIER：中性变更，人工过目";;
          esac
