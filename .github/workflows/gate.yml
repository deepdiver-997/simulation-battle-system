name: gate

# 构建 + 场景回归 + PR 分类。数据库不入库：现场从社区公开镜像构建并按镜像
# commit 缓存（见 db-refresh.yml 同一缓存键）。
# ⚠️ runner 钉住 ubuntu-24.04（不追 latest）：构建可复现性依赖钉住的系统依赖世界，
# latest 被 GitHub 滚动升级时会无预警破坏构建。升级 runner = 显式改动 + 跑全量门。
# 政策（2026-11-20）：不承诺多发行版；Windows 走 MinGW（M2 已验收，nightly 抽样门 = windows-nightly
# job，全量对拍走 wuying 云电脑）；macOS 由维护者本机全量门覆盖。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'   # 每日 05:00 +08:00 全量回归（nightly）
  workflow_dispatch:

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db:
    runs-on: ubuntu-24.04
    outputs:
      mirror_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          # 带 runner token：未认证 60 次/h/IP 在共享 Azure 出口池经常被打空（2026-11-21
          # dispatch 实证，curl -sf 静默吞 403 → python 吃空输入报 JSONDecodeError）；
          # GITHUB_TOKEN 对公开仓的 REST 配额是按安装 1000+/h。
          SHA=$(curl -sfL -H "Authorization: Bearer ${{ github.token }}" \
                https://api.github.com/repos/SeerAPI/seer-unity-assets/commits/HEAD \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "镜像 HEAD：$SHA"
      - uses: actions/cache@v4
        id: cache
        with:
          path: scripts/data/processed
          key: seer-db-${{ steps.meta.outputs.sha }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install seerapi-solaris
          python3 scripts/fetch_seer_unity_bytes.py
          python3 scripts/decode_seer_bytes.py
          python3 scripts/import_seer_unity_sqlite.py
          tools/db_patches/apply_all.sh
          ls -lh scripts/data/processed/seer_unity.sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: seer-db
          path: scripts/data/processed/seer_unity.sqlite

  build-test:
    needs: db
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # PR 场景提取需要 diff
      - uses: actions/download-artifact@v4
        with: { name: seer-db, path: scripts/data/processed }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: |
          sudo apt-get update && sudo apt-get install -y ccache
          ccache --max-size=500M
      - name: configure & build
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)
      - name: registry dump
        run: ./build/sim_server --dump-registry-exit build/registry.json
      - name: smoke
        run: ./build/sim_smoke_test
      - name: affected scenarios（PR）
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          IDS=$(git diff --name-only "$BASE"...HEAD -- test/scenario/ \
                | grep -oE 'scenario_[0-9]+' | grep -oE '[0-9]+' | sort -un || true)
          FAILED=0
          for b in build/sim_scenario_*; do
            id=$(basename "$b" | grep -oE '[0-9]+' | head -1)
            # PR 只跑变更场景 + 号段相邻场景（同族联动）；nightly 跑全量
            if [ -n "$IDS" ] && ! echo "$IDS" | grep -qw "$id"; then continue; fi
            timeout 300 "$b" || { echo "FAIL $b"; FAILED=1; }
          done
          exit $FAILED
      - name: all scenarios（nightly / push main）
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          FAILED=0
          for b in build/sim_scenario_*; do
            timeout 300 "$b" || { echo "FAIL $b"; FAILED=1; }
          done
          exit $FAILED
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: registry-json, path: build/registry.json }

  # Windows 门（移植决策 D1/D2 口径：MSYS2 UCRT64 MinGW + PowerShell/pwsh）。
  # 只在 nightly 与手动触发跑，与 ubuntu build-test 并行（同 needs: db，public runner 免费）。
  # 范围 = sim_server + smoke + 三插件部署 + 抽样场景（排序后每 10 取 1 ≈ 100 个）——
  # 全量 982 场景对拍走 wuying 云电脑（docs_local/docs/07-工具与测试/Windows-移植.md §6），不烧 runner。
  windows-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: db
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: seer-db, path: scripts/data/processed }
      - name: toolchain（MSYS2 UCRT64 MinGW-w64）
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false          # runner 自带 C:\msys64，不滚动升级组件（对齐 ubuntu 钉版本口径）
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sqlite3
      - name: configure & build（引擎 + 插件部署 + 抽样场景）
        run: |
          # runner 镜像自带 C:\mingw64 会抢编译器、GITHUB_PATH 前置实测不生效（2026-11-21
          # 首跑实证）→ 工具链一律显式绝对路径，运行 DLL 在每步内联前置 PATH。
          $u = 'C:/msys64/ucrt64'
          $env:PATH = "C:\msys64\ucrt64\bin;C:\msys64\usr\bin;$env:PATH"
          Add-MpPreference -ExclusionPath (Get-Location) -ErrorAction SilentlyContinue   # D8：显式排除实时扫描（100+ 小链接显著拖慢）
          if (-not (Test-Path "$u/include/sqlite3.h")) {
            Get-ChildItem "$u/lib" -Filter '*sqlite*' -ErrorAction SilentlyContinue | Select-Object -First 5
            throw "缺 $u/include/sqlite3.h（setup-msys2 的 pacman 安装未生效？）"
          }
          $sqliteLib = @("$u/lib/libsqlite3.dll.a", "$u/lib/libsqlite3.a") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sqliteLib) { throw "ucrt64 下找不到 libsqlite3（.dll.a/.a）" }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_MAKE_PROGRAM=$u/bin/ninja.exe" `
            "-DCMAKE_C_COMPILER=$u/bin/gcc.exe" "-DCMAKE_CXX_COMPILER=$u/bin/g++.exe" `
            "-DCMAKE_PREFIX_PATH=$u" `
            "-DSQLite3_INCLUDE_DIR=$u/include" "-DSQLite3_LIBRARY=$sqliteLib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 确定性抽样：场景源按名排序后每 10 取 1（目标命名同 gate.ps1 全量门：sim_<basename>）
          $targets = @('sim_server','sim_smoke_test',
                       'moves_plugin_deploy','soul_plugin_deploy','suit_plugin_deploy')
          $srcs = @(Get-ChildItem test/scenario -Filter 'scenario_*.cpp' | Sort-Object Name)
          for ($i = 0; $i -lt $srcs.Count; $i += 10) { $targets += "sim_$($srcs[$i].BaseName)" }
          "Windows nightly：抽样 $($targets.Count - 5)/$($srcs.Count) 场景" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          cmake --build build -j $env:NUMBER_OF_PROCESSORS --target @targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: registry dump
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"   # 运行期 MinGW/sqlite DLL（sbs_rand.dll 在 exe 旁）
          ./build/sim_server.exe --dump-registry-exit build/registry.json
      - name: smoke
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          ./build/sim_smoke_test.exe
      - name: sampled scenarios（单例 120s 超时，口径同 gate.ps1）
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $fail = 0
          $bins = @(Get-ChildItem build -Filter 'sim_scenario_*.exe' | Sort-Object Name)
          foreach ($exe in $bins) {
            # 场景二进制必须以仓库根为 CWD（DB/插件按相对路径加载，同 gate.ps1）
            $p = Start-Process -FilePath $exe.FullName -WorkingDirectory (Get-Location) -NoNewWindow -PassThru
            if (-not $p.WaitForExit(120000)) {
              try { $p.Kill() } catch {}
              Write-Host "TIMEOUT $($exe.Name)"; $fail++; continue
            }
            if ($p.ExitCode -ne 0) { Write-Host "FAIL($($p.ExitCode)) $($exe.Name)"; $fail++ }
          }
          "Windows 抽样回归：$($bins.Count - $fail)/$($bins.Count) 绿" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          exit ([int][bool]$fail)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: registry-json-windows, path: build/registry.json }

  classify:
    if: github.event_name == 'pull_request'
    needs: build-test
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.out.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: label-check
        run: |
          if gh pr view ${{ github.event.pull_request.number }} --json labels \
               -q '.labels[].name' 2>/dev/null | grep -qx 'kernel-approved'; then
            echo "KERNEL_APPROVED=1" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - id: out
        run: tools/ci/classify.sh \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
        # classify.sh 退出码：1=需人工（mixed/kernel），2=引注缺失
        continue-on-error: true

  verdict:
    if: github.event_name == 'pull_request'
    needs: [build-test, classify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: apply tier policy
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ needs.classify.outputs.tier }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case "$TIER" in
            effects-new)
              gh pr edit "$PR" --add-label tier0-auto
              gh pr merge "$PR" --auto --squash
              echo "tier0：CI 全绿 + 引注齐，已挂自动合并"
              ;;
            effects-ruling)
              gh pr edit "$PR" --add-label needs-ruling
              gh pr comment "$PR" --body "修改了既有效果/场景期望值（口径变更），等待维护者终审。"
              ;;
            kernel)
              gh pr comment "$PR" --body "内核改动需要先开 issue 讨论并取得 kernel-approved 标签。当前 PR 会被阻止合并。"
              exit 1
              ;;
            mixed)
              gh pr comment "$PR" --body "效果层与内核层混碰：请拆成两个 PR（机器拒因见 gate 摘要）。"
              exit 1
              ;;
            *) echo "tier=$TIER：中性变更，人工过目";;
          esac
