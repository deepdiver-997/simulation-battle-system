# tools/agents/harnesses.conf — 无头派发适配表（被 spawn.sh source）
#
# 每家 harness 两个函数：
#   harness_<名>_cmd              读环境 $SPAWN_PROMPT（完整提示词）与 $SPAWN_RUN_DIR（本次 run 目录），
#                                 填充数组 HARNESS_CMD 和标志 HARNESS_RESUME（1=支持 resume）
#   harness_<名>_resume_cmd <session-id> <追加指令>
#                                 填充 HARNESS_CMD；不支持的 harness 不定义此函数
# 通用约定：最终结果/进度走 stdout（spawn 落到 run 目录的 stream.log），
# session id 从输出里惰性提取（键名匹配 session_id / thread_id / conversation_id 任一）。
#
# 本机微调：不改本文件，建 harnesses.conf.local（gitignored）覆盖同名函数或变量。
#
# 权限默认值说明：无头运行没人批权限——
#   claude 默认 --dangerously-skip-permissions（夜跑形态；安全栏杆是 AGENTS.md 红线 +
#   build.sh 的全局锁/生产拦截/STOP 哨兵）。想收紧：CLAUDE_PERM_ARGS="--permission-mode acceptEdits"
#   codex 默认 --sandbox workspace-write（无网络）；要全放开：CODEX_SANDBOX=danger-full-access

# ---------- claude ----------
harness_claude_cmd() {
    HARNESS_RESUME=1
    CLAUDE_BIN="${CLAUDE_BIN:-$HOME/.local/bin/claude}"
    command -v "$CLAUDE_BIN" >/dev/null 2>&1 || CLAUDE_BIN="claude"
    CLAUDE_PERM_ARGS="${CLAUDE_PERM_ARGS:---dangerously-skip-permissions}"
    # shellcheck disable=SC2086  # CLAUDE_PERM_ARGS 是多个旗标，故意分词
    HARNESS_CMD=("$CLAUDE_BIN" -p "$SPAWN_PROMPT" --output-format stream-json --verbose $CLAUDE_PERM_ARGS)
}

harness_claude_resume_cmd() { # $1=session-id $2=追加指令
    HARNESS_RESUME=1
    CLAUDE_BIN="${CLAUDE_BIN:-$HOME/.local/bin/claude}"
    command -v "$CLAUDE_BIN" >/dev/null 2>&1 || CLAUDE_BIN="claude"
    CLAUDE_PERM_ARGS="${CLAUDE_PERM_ARGS:---dangerously-skip-permissions}"
    # shellcheck disable=SC2086
    HARNESS_CMD=("$CLAUDE_BIN" -p "$2" --resume "$1" --output-format stream-json --verbose $CLAUDE_PERM_ARGS)
}

# ---------- codex ----------
# 如需出网前置检查（代理探测等），自备包装并设 CODEX_BIN（如 harnesses.conf.local 里指向本机脚本）。
harness_codex_cmd() {
    HARNESS_RESUME=1
    CODEX_BIN="${CODEX_BIN:-codex}"
    CODEX_SANDBOX="${CODEX_SANDBOX:-workspace-write}"
    HARNESS_CMD=("$CODEX_BIN" exec --json --sandbox "$CODEX_SANDBOX" \
        -o "${SPAWN_RUN_DIR}/last-message.txt" "$SPAWN_PROMPT")
}

harness_codex_resume_cmd() { # $1=session-id $2=追加指令
    HARNESS_RESUME=1
    CODEX_BIN="${CODEX_BIN:-codex}"
    CODEX_SANDBOX="${CODEX_SANDBOX:-workspace-write}"
    HARNESS_CMD=("$CODEX_BIN" exec resume "$1" --json --sandbox "$CODEX_SANDBOX" \
        -o "${SPAWN_RUN_DIR}/last-message.txt" "$2")
}

# ---------- gemini（未实测，装好后按本机 CLI 调整）----------
harness_gemini_cmd() {
    HARNESS_RESUME=0
    GEMINI_BIN="${GEMINI_BIN:-gemini}"
    HARNESS_CMD=("$GEMINI_BIN" -p "$SPAWN_PROMPT")
}

# ---------- dummy（测试管道用，不起 LLM）----------
harness_dummy_cmd() {
    HARNESS_RESUME=1
    HARNESS_CMD=(bash -c 'printf "{\"session_id\": \"dummy-%s\"}\n" "$$"
        sleep "${DUMMY_SLEEP:-2}"
        printf "dummy 完成：任务开头 = %s\n" "$(printf "%s" "$SPAWN_PROMPT" | tr "\n" " " | cut -c1-50)"')
}

harness_dummy_resume_cmd() { # $1=session-id $2=追加指令
    HARNESS_RESUME=1
    HARNESS_CMD=(bash -c 'printf "{\"session_id\": \"%s\"}\n" "$1"
        printf "dummy resume：%s\n" "$2"' _ "$1" "$2")
}
